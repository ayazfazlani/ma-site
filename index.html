<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Loading Animation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #1a1a1a;
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        gap: 2rem;
        flex-wrap: wrap;
        justify-content: center;
        padding: 1rem;
      }

      /* Style 2: Spinning Border Animation */
      .spinner-card {
        width: 300px;
        height: 400px;
        background: #2d2d2d;
        border-radius: 15px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      .spinner-card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          transparent,
          transparent,
          transparent,
          #ff6b6b
        );
        animation: spin 4s linear infinite;
      }

      .spinner-card::after {
        content: "";
        position: absolute;
        inset: 3px;
        background: #2d2d2d;
        border-radius: 13px;
      }

      .spinner-content {
        position: relative;
        z-index: 2;
        padding: 20px;
        color: white;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Style 3: Dashed Border Animation */

      /* Common styles for all cards */
      h3 {
        margin-bottom: 10px;
        color: #4ecdc4;
      }

      p {
        color: #999;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Card 1: Gradient Border Animation -->
      <!-- <div class="loading-card">
        <div class="card-content">
          <div class="card-header">

          <div class="text-lines">
            <div class="text-line"></div>
            <div class="text-line"></div>
            <div class="text-line"></div>
          </div>
        </div>
      </div> -->

      <!-- Card 2: Spinning Border Animation -->
      <div class="spinner-card">
        <div class="spinner-content">
          <h3>Loading...</h3>
          <p>Please wait while we fetch your content</p>
        </div>
      </div>

      <!-- Card 3: Dashed Border Animation -->

        <div class="dashed-border"></div>
        <div class="dashed-content">
          <h3>Processing</h3>

        </div>
      </div> -->
    </div>
  </body>
</html>
